{% if site.comments %}
{% if site.giscus.enable %}
<!-- Giscus Comments -->
<script src="https://giscus.app/client.js"
	data-repo="{{ site.giscus.repo }}"
	data-repo-id="{{ site.giscus.repo_id }}"
	data-category="{{ site.giscus.category }}"
	data-category-id="{{ site.giscus.category_id }}"
	data-mapping="{{ site.giscus.mapping }}"
	data-strict="{{ site.giscus.strict }}"
	data-reactions-enabled="{{ site.giscus.reactions_enabled }}"
	data-emit-metadata="{{ site.giscus.emit_metadata }}"
	data-input-position="{{ site.giscus.input_position }}"
	data-theme="{% if site.giscus.theme-dark %}preferred_color_scheme{% else %}{{ site.giscus.theme }}{% endif %}"
	data-lang="{{ site.giscus.lang }}"
	data-loading="{{ site.giscus.loading }}"
	crossorigin="anonymous"
	async>
</script>
{% if site.giscus.theme-dark %}
<script>
	(function () {
		var lightTheme = "{{ site.giscus.theme }}";
		var darkTheme = "{{ site.giscus.theme-dark }}";
		function getGiscusTheme() {
			var siteTheme = document.documentElement.getAttribute('data-theme');
			return siteTheme === 'dark' ? darkTheme : lightTheme;
		}
		function syncGiscusTheme() {
			var iframe = document.querySelector('iframe.giscus-frame');
			if (iframe) {
				iframe.contentWindow.postMessage({ giscus: { setConfig: { theme: getGiscusTheme() } } }, 'https://giscus.app');
			}
		}
		// Giscus iframe 出现后立即同步主题
		var iframeObserver = new MutationObserver(function () {
			var iframe = document.querySelector('iframe.giscus-frame');
			if (iframe) {
				iframeObserver.disconnect();
				syncGiscusTheme();
			}
		});
		iframeObserver.observe(document.body, { childList: true, subtree: true });
		// 监听网站主题切换，同步到 Giscus
		new MutationObserver(syncGiscusTheme).observe(document.documentElement, {
			attributes: true,
			attributeFilter: ['data-theme']
		});
	})();
</script>
{% endif %}
{% elsif site.utterances.enable %}
<!-- Utterances Comments -->
<script src="https://utteranc.es/client.js"
	repo="{{ site.utterances.repo }}"
	issue-term="{{ site.utterances.issue_term }}"
	label="{{ site.utterances.label }}"
	theme="{{ site.utterances.theme }}"
	crossorigin="anonymous"
	async>
</script>
{% elsif site.gitalk.enable %}
<!-- Gitalk Comments -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gitalk@1.8.0/dist/gitalk.css">
<script src="https://cdn.jsdelivr.net/npm/blueimp-md5@2.19.0/js/md5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gitalk@1.8.0/dist/gitalk.min.js"></script>
<div id="gitalk-container"></div>
<script>
	document.addEventListener('DOMContentLoaded', function() {
		const gitalk = new Gitalk({
			clientID: '{{ site.gitalk.clientID }}',
			clientSecret: '{{ site.gitalk.clientSecret }}',
			repo: '{{ site.gitalk.repo }}',
			owner: '{{ site.gitalk.owner }}',
			admin: ['{{ site.gitalk.admin }}'],
			id: md5(location.pathname),
			distractionFreeMode: {{ site.gitalk.distractionFreeMode }}
		});
		gitalk.render('gitalk-container');
	});
</script>
{% endif %}
{% endif %}
